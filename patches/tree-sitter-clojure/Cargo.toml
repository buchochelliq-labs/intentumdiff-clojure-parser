[package]
name = "tree-sitter-clojure"
version = "0.1.0"
edition = "2021"
license = "MIT"
# Patched: grammar-src/src/parser.c pre-compiled to lib/libtree_sitter_clojure.a for wasm32-wasip2.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_clojure"
path = "src/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
